<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitura de Transmissão | GLITCHcore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        /* CSS Adaptativo para a Página de Notícia */
        body { background-color: var(--bg-principal); color: var(--texto-principal); transition: background 0.3s ease; overflow-x: hidden; }
        
        /* CORREÇÃO DA CAPA: Reduzido de 85vh para 55vh com altura mínima */
        .article-hero { height: 55vh; min-height: 450px; background-size: cover; background-position: center; position: relative; margin-top: 70px; }
        
        .article-overlay { 
            position: absolute; bottom: 0; width: 100%; height: 90%; 
            background: linear-gradient(to top, var(--bg-principal) 5%, transparent 100%); 
            display: flex; align-items: flex-end; padding-bottom: 30px; 
        }
        
        .article-content { 
            font-size: 1.25rem; line-height: 2; color: var(--texto-principal); 
            font-family: 'Inter', 'Segoe UI', sans-serif; 
        }
        
        .article-content img { 
            width: 100%; max-height: 600px; object-fit: cover; border-radius: 16px; 
            margin: 40px 0; box-shadow: 0 15px 40px rgba(0,0,0,0.3); border: 1px solid var(--borda);
        }

        .article-content iframe {
            width: 100%; aspect-ratio: 16 / 9; 
            border-radius: 16px; margin: 40px 0; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.3); border: 1px solid var(--borda);
        }

        .comment-box { background: var(--bg-cards); border: 1px solid var(--borda); border-radius: 12px; padding: 20px; margin-bottom: 15px; }
        .comment-avatar { width: 50px; height: 50px; object-fit: cover; border: 2px solid var(--neon-blue); }
        
        .navbar-reading {
            background: var(--bg-principal) !important;
            opacity: 0.95; backdrop-filter: blur(15px); border-bottom: 1px solid var(--borda);
        }

        /* BOTÕES DE COMPARTILHAMENTO */
        .share-btn { width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; border: none; transition: 0.3s; color: white; }
        .share-btn:hover { transform: translateY(-5px) scale(1.1); }
        .share-wpp { background: #25D366; color: #fff !important; }
        .share-x { background: #000; border: 1px solid #333; color: #fff !important; }
        .share-copy { background: var(--neon-blue); color: #000 !important; }
    </style>
</head>
<body>

    <script>
        (function() {
            const temaSalvo = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', temaSalvo);
        })();
    </script>

    <nav class="navbar navbar-reading py-3 fixed-top">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="index.html" class="navbar-brand fw-bold mb-0 logo-glitch" data-text="GLITCHcore" style="letter-spacing: 2px; font-size: 1.5rem;">GLITCHcore</a>
            <a href="index.html" class="btn btn-outline-danger btn-sm fw-bold"><i class="fa-solid fa-arrow-left me-2"></i> VOLTAR</a>
        </div>
    </nav>

    <div id="conteudo-noticia">
        <div class="container text-center text-muted" style="margin-top: 150px;">
            <div class="spinner-grow text-danger" role="status"></div>
            <p class="mt-3">Carregando imersão visual...</p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC-HlFxDsp4AsbezKd28YpiQZi3UHUipbc",
            authDomain: "nexus-6d8df.firebaseapp.com",
            projectId: "nexus-6d8df",
            storageBucket: "nexus-6d8df.firebasestorage.app",
            messagingSenderId: "1045779517061",
            appId: "1:1045779517061:web:f2d6877724cee68374a3ec"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        const params = new URLSearchParams(window.location.search);
        const idDaNoticia = params.get('id');
        let usuarioAtual = null;

        function showToast(mensagem, tipo = 'info') {
            let container = document.getElementById('glitch-toast-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'glitch-toast-container';
                document.body.appendChild(container);
            }
            const toast = document.createElement('div');
            toast.className = `glitch-toast toast-${tipo}`;
            let icone = '<i class="fa-solid fa-circle-info text-info"></i>';
            if (tipo === 'success') icone = '<i class="fa-solid fa-check text-success"></i>';
            if (tipo === 'error') icone = '<i class="fa-solid fa-triangle-exclamation text-danger"></i>';
            toast.innerHTML = `${icone} <span>${mensagem}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, 3500);
        }

        window.copiarLink = function() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                showToast("Link copiado para a área de transferência!", "success");
            });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            if (!idDaNoticia) {
                document.getElementById('conteudo-noticia').innerHTML = '<div class="container mt-5 text-danger text-center"><i class="fa-solid fa-bug fs-1 mb-3"></i><h5>Nenhuma matéria selecionada.</h5></div>';
                return;
            }

            try {
                const res = await fetch(`/api/news/${idDaNoticia}`);
                if (!res.ok) throw new Error("Notícia não encontrada");
                const noticia = await res.json();

                let textoProcessado = noticia.conteudo;
                const tagsArray = noticia.tags ? noticia.tags.split(',') : ['Atualização'];
                const tagsHTML = tagsArray.map(tag => `<span class="badge bg-dark border border-secondary text-info px-3 py-2 fs-6 mb-2 me-2"><i class="fa-solid fa-hashtag me-1"></i>${tag.trim()}</span>`).join('');

                document.getElementById('conteudo-noticia').innerHTML = `
                    <header class="article-hero" style="background-image: url('${noticia.imagem}')">
                        <div class="article-overlay">
                            <div class="container">
                                <div class="row justify-content-center">
                                    <div class="col-lg-10 col-xl-9 text-center">
                                        <span class="badge bg-danger mb-4 text-uppercase px-4 py-2 letter-spacing-1 fs-6 shadow">${noticia.plataforma}</span>
                                        <h1 class="display-3 fw-bold text-white mb-4" style="text-shadow: 2px 2px 10px #000;">${noticia.titulo}</h1>
                                        <div class="d-flex justify-content-center align-items-center gap-4 fw-bold text-white mb-4" style="text-shadow: 1px 1px 5px #000;">
                                            <span><i class="fa-solid fa-user-ninja text-info me-2"></i>${noticia.autor || 'Comando GLITCHcore'}</span>
                                            <span><i class="fa-regular fa-calendar text-danger me-2"></i>${noticia.data}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </header>
                    
                    <main class="container mb-5 pb-5 mt-4">
                        <div class="row justify-content-center">
                            <div class="col-lg-10 col-xl-9">
                                ${noticia.resumo ? `
                                <div class="bg-dark p-4 rounded-3 border-start border-4 border-danger mb-5 border border-secondary shadow-lg">
                                    <p class="fs-4 fst-italic mb-0" style="line-height: 1.6; color: var(--texto-principal);">${noticia.resumo}</p>
                                </div>` : ''}
                                
                                <div class="d-flex flex-wrap align-items-center justify-content-between mb-5 border-bottom border-secondary pb-4 gap-3">
                                    <div>${tagsHTML}</div>
                                    
                                    <div class="d-flex gap-2">
                                        <button class="share-btn share-wpp shadow" onclick="window.open('https://api.whatsapp.com/send?text=Olha essa matéria no GLITCHcore: ' + encodeURIComponent(window.location.href), '_blank')" title="Mandar no WhatsApp">
                                            <i class="fa-brands fa-whatsapp"></i>
                                        </button>
                                        <button class="share-btn share-x shadow" onclick="window.open('https://twitter.com/intent/tweet?text=Confira no GLITCHcore: &url=' + encodeURIComponent(window.location.href), '_blank')" title="Postar no X">
                                            <i class="fa-brands fa-x-twitter"></i>
                                        </button>
                                        <button class="share-btn share-copy shadow" onclick="copiarLink()" title="Copiar Link">
                                            <i class="fa-solid fa-link"></i>
                                        </button>
                                    </div>
                                </div>

                                <div class="article-content">
                                    ${textoProcessado}
                                </div>
                            </div>
                        </div>

                        <div class="row justify-content-center mt-5">
                            <div class="col-lg-10 col-xl-9 pt-5 border-top border-secondary">
                                <h3 class="fw-bold mb-5 font-syncopate letter-spacing-1 text-center"><i class="fa-solid fa-comments text-danger me-2"></i> QG da Comunidade</h3>
                                
                                <div id="alertaLogar" class="alert alert-dark border-secondary text-center mb-4 py-4 d-none">
                                    <i class="fa-solid fa-lock text-muted fs-2 mb-3"></i>
                                    <h5>Acesso Restrito</h5>
                                    <p class="mb-0">Você precisa logar na página inicial para enviar mensagens.</p>
                                </div>

                                <div id="formComentarioArea" class="p-4 rounded-4 border border-secondary mb-5 d-none" style="background: var(--bg-cards);">
                                    <div class="d-flex gap-3">
                                        <img id="imgFormComentario" src="" class="rounded-circle comment-avatar shadow" referrerpolicy="no-referrer">
                                        <div class="flex-grow-1">
                                            <textarea id="textoComentario" class="form-control mb-3 p-3 bg-dark border-secondary text-white" rows="3" placeholder="Qual sua tática para isso, soldado?"></textarea>
                                            <button id="btnEnviarComentario" class="btn btn-danger fw-bold letter-spacing-1 px-5 float-end">PUBLICAR</button>
                                        </div>
                                    </div>
                                </div>

                                <div id="listaComentarios">
                                    <div class="text-center text-muted"><div class="spinner-border spinner-border-sm text-info"></div> Carregando QG...</div>
                                </div>
                            </div>
                        </div>
                    </main>
                `;

                auth.onAuthStateChanged(usuario => {
                    usuarioAtual = usuario;
                    const alertaLogar = document.getElementById('alertaLogar');
                    const formComentarioArea = document.getElementById('formComentarioArea');

                    if (usuario) {
                        alertaLogar?.classList.add('d-none');
                        formComentarioArea?.classList.remove('d-none');
                        const img = document.getElementById('imgFormComentario');
                        if (img) img.src = usuario.photoURL || `https://ui-avatars.com/api/?name=${usuario.displayName}&background=ff003c&color=fff`;
                    } else {
                        alertaLogar?.classList.remove('d-none');
                        formComentarioArea?.classList.add('d-none');
                    }
                    carregarComentarios();
                });

                document.getElementById('btnEnviarComentario').addEventListener('click', async () => {
                    const textoArea = document.getElementById('textoComentario');
                    const texto = textoArea.value.trim();
                    if (!texto || !usuarioAtual) return; 

                    const btn = document.getElementById('btnEnviarComentario');
                    btn.disabled = true;
                    btn.innerHTML = 'ENVIANDO...';

                    const dadosComentario = {
                        nome: usuarioAtual.displayName,
                        foto: usuarioAtual.photoURL || `https://ui-avatars.com/api/?name=${usuarioAtual.displayName}&background=ff003c&color=fff`,
                        texto: texto
                    };

                    try {
                        const resposta = await fetch(`/api/news/${idDaNoticia}/comments`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(dadosComentario)
                        });
                        if (resposta.ok) {
                            textoArea.value = ''; 
                            showToast("Comentário publicado!", "success");
                            carregarComentarios(); 
                        }
                    } catch (error) { 
                        showToast("Erro ao publicar o comentário.", "error");
                    } finally {
                        btn.disabled = false;
                        btn.innerHTML = 'PUBLICAR';
                    }
                });

            } catch (erro) {
                document.getElementById('conteudo-noticia').innerHTML = '<div class="container mt-5 text-danger text-center"><i class="fa-solid fa-ban fs-1 mb-3"></i><h5>Matéria corrompida ou deletada.</h5></div>';
            }
        });

        async function carregarComentarios() {
            const listaDiv = document.getElementById('listaComentarios');
            if (!listaDiv) return;
            try {
                const res = await fetch(`/api/news/${idDaNoticia}/comments`);
                const comentarios = await res.json();
                listaDiv.innerHTML = ''; 

                if (comentarios.length === 0) {
                    listaDiv.innerHTML = '<div class="text-center text-muted py-5 rounded-4 border border-secondary"><h5>O rádio está mudo.</h5></div>';
                    return;
                }

                const isAdmin = usuarioAtual && usuarioAtual.email === 'kromossomo.m@gmail.com';
                comentarios.forEach(com => {
                    const qtdLikes = com.likes || 0;
                    const deletarHTML = isAdmin ? `<button class="btn btn-sm text-danger border-0 opacity-50 hover-opacity-100" onclick="deletarComentario('${idDaNoticia}', '${com.id}')"><i class="fa-solid fa-trash-can"></i></button>` : '';
                    
                    listaDiv.innerHTML += `
                        <div class="comment-box d-flex gap-3">
                            <img src="${com.foto}" class="rounded-circle comment-avatar shadow-sm" referrerpolicy="no-referrer">
                            <div class="w-100">
                                <div class="d-flex justify-content-between mb-2">
                                    <div>
                                        <h6 class="fw-bold mb-0 text-info">${com.nome}</h6>
                                        <small class="text-muted">${com.data}</small>
                                    </div>
                                    <div>
                                        <button class="text-muted heart-btn fs-5 px-2 bg-transparent border-0" onclick="curtirComentario('${idDaNoticia}', '${com.id}', this)">
                                            <i class="fa-solid fa-heart"></i> <span class="like-count fs-6">${qtdLikes}</span>
                                        </button>
                                        ${deletarHTML}
                                    </div>
                                </div>
                                <p class="mb-0 fs-5">${com.texto}</p>
                            </div>
                        </div>`;
                });
            } catch (e) { console.error(e); }
        }

        window.deletarComentario = async function(nId, cId) {
            if (confirm("Eliminar comentário?")) {
                await fetch(`/api/news/${nId}/comments/${cId}`, { method: 'DELETE' });
                showToast("Ameaça neutralizada.", "success");
                carregarComentarios();
            }
        };

        window.curtirComentario = async function(nId, cId, btn) {
            if (btn.classList.contains('liked')) return;
            const res = await fetch(`/api/news/${nId}/comments/${cId}/like`, { method: 'POST' });
            if (res.ok) {
                const data = await res.json();
                btn.innerHTML = `<i class="fa-solid fa-heart"></i> <span class="like-count fs-6">${data.likes}</span>`;
                btn.classList.add('liked');
                btn.classList.remove('text-muted');
                btn.classList.add('text-danger');
            }
        };
    </script>
</body>
</html>
